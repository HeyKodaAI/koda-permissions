[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koda-permissions"
version = "0.1.1"
description = "Deny-by-default, risk-tiered permission system for AI agent actions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mike Wandzilak", email = "mike@wandzilakwebdesign.com"}]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110"
]

[project.urls]
Homepage = "https://github.com/HeyKodaAI/koda-permissions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
